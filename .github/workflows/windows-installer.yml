name: Windows installer
on:
  workflow_dispatch:
  push:
    paths:
      - 'app/**'
      - 'templates/**'
      - 'incoming/**'
      - 'icons/**'
      - 'README.md'
      - 'windows-installation.txt'
      - 'packaging/windows/**'
      - 'tests/**'
      - '.github/workflows/windows-installer.yml'
  pull_request:
    paths:
      - 'app/**'
      - 'templates/**'
      - 'incoming/**'
      - 'icons/**'
      - 'README.md'
      - 'windows-installation.txt'
      - 'packaging/windows/**'
      - 'tests/**'
      - '.github/workflows/windows-installer.yml'
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          architecture: x64
      - name: Test dependency setup
        shell: powershell
        run: ./tests/test_windows_setup.ps1
      - name: Test runtime integration
        shell: powershell
        run: python -m unittest discover -s tests -p test_windows_runtime.py -v
      - name: Test Windows 1803 download fallback
        shell: powershell
        run: ./tests/test_windows_downloads.ps1
      - name: Build installer
        shell: powershell
        run: ./packaging/windows/build.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: SOVA-Windows-installer
          path: dist/SOVA-Setup-*
          if-no-files-found: error
